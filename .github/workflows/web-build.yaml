name: Build capybara web image

on:
  push:
    tags:
      - "web-v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/capybara_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: capybara_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d capybara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Verify unit checks
        working-directory: web
        run: npm test && npm run lint && npm run typecheck
      - name: Migrate integration database
        working-directory: web
        run: npm run db:migrate
      - name: Verify PostgreSQL dispatch flow
        working-directory: web
        run: npm run test:integration
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Verify mobile CRUD
        working-directory: web
        run: npm run test:browser
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/capybara
          tags: |
            type=match,pattern=web-v(.*),group=1
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
